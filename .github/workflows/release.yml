name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check src tests
      - run: python -m build
      - name: Validate release manifests
        run: |
          python -m dcc_mcp_runtime.cli validate-manifest runtime/manifest.json
          for f in runtime/manifests/*.json; do python -m dcc_mcp_runtime.cli validate-manifest "$f" >/dev/null; done
      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*
            runtime/manifest.json
            runtime/manifests/*.json
            docs/migration/*.md
