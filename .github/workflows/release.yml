name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and release tooling
        run: python -m pip install -e ".[dev]"
      - name: Test release commit
        run: python -m pytest -q
      - name: Lint release commit
        run: python -m ruff check src tests
      - name: Check formatting
        run: python -m ruff format --check src tests
      - name: Validate manifests
        run: |
          python -m dcc_mcp_runtime.cli validate-manifest runtime/manifest.json
          for f in runtime/manifests/*.json; do python -m dcc_mcp_runtime.cli validate-manifest "$f" >/dev/null; done
      - name: Build release artifacts
        run: python -m build
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/*
            runtime/manifest.json
            runtime/manifests/*.json
            docs/migration/*.md

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release-please, build-release]
    if: needs.release-please.outputs.release_created == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/dcc-mcp-runtime
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release identity and version
        env:
          EXPECTED_VERSION: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release target must be a canonical vMAJOR.MINOR.PATCH tag." >&2
            exit 1
          }
          export EXPECTED_VERSION="${RELEASE_TAG#v}"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected = os.environ["EXPECTED_VERSION"]
          manifest = json.loads(Path(".release-please-manifest.json").read_text(encoding="utf-8"))["."]
          source = Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'^version = "([0-9]+\.[0-9]+\.[0-9]+)"', source, re.MULTILINE)
          if match is None or manifest != expected or match.group(1) != expected:
              raise SystemExit("Checked-out package version does not match the release target.")
          PY

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true
          print-hash: true
